services:
  - type: web
    name: ems-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements_web.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false